version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niche-content-engine-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    env_file:
      - .env.local
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: niche-content-engine-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local
